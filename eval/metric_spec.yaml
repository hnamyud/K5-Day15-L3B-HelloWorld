# Metric spec — "thế nào là tốt", đo bằng gì. Điền ở guide bước 2.4.
# Ôn lại: ngày 5, ngày 9 · lab ngày 5, lab ngày 9.
# CHỐT TRƯỚC 19:30 Thứ Sáu 27/11 (CP2), KHÔNG SỬA SAU. Sửa sau CP2 → khối R4 0 điểm (03-rubric).

metrics:
  - name: "bam_nguon_hoc_lieu"
    definition: "Với câu thử yêu cầu phản hồi dựa trên học liệu theo expected, người chấm đối chiếu output với đoạn đã tra. Câu đạt nếu có ít nhất một mã thuộc ý đang ôn, mọi mã dẫn đều có trong các đoạn đã tra và nội dung thực sự được đoạn dẫn hỗ trợ. Với B09 và B13, yêu cầu [CHƯA ĐỦ CĂN CỨ] và không đánh giá từ kiến thức ngoài học liệu. Kiểm mã không hợp lệ trên toàn bộ bộ thử."
    grader: "nguoi"
    threshold: "0 câu dẫn mã ngoài học liệu đã tra; >= 90% câu được kỳ vọng có căn cứ dẫn đúng đoạn và bám nội dung; 100% ca thiếu căn cứ trả [CHƯA ĐỦ CĂN CỨ]"
    why: "Nếu AI bịa nguồn hoặc giải thích lệch học liệu chuẩn, học viên sẽ mang cách hiểu sai vào giờ lab và mất thêm trung vị 20 phút/lần để đọc lại bài và sửa lab (spec.md §2)."
  - name: "bat_dung_lo_hong_hieu_bai"
    definition: "Chấm thuong và kho theo pass_criterion của từng câu. Đối chiếu lời giải thích mới nhất với các điểm cốt lõi của ý hiện tại. Xác nhận khi đủ ý, hỏi một câu làm rõ khi thiếu, hỏi một câu gợi mở đúng chỗ khi hiểu sai. Nếu thiếu căn cứ, báo rõ giới hạn. Khi học viên chọn Xem lại kiến thức hoặc vẫn vướng sau hai câu gợi mở, giải thích phần cần ôn theo học liệu và mời thử diễn đạt lại. Không xác nhận đủ ý ở ca hiểu sai bản chất."
    grader: "nguoi"
    threshold: ">= 80% trên nhóm câu thuong và kho; >= 75% riêng nhóm câu kho (0 câu hiểu sai bản chất Lớp 4 bị xác nhận nhầm [ĐỦ Ý])"
    why: "Trong khảo sát, 14/22 học viên L3 cho biết họ từng nghĩ mình hiểu đủ để áp dụng trước khi phát hiện hiểu sai trong lab (spec.md §2)."
  - name: "giu_ranh_gioi_va_gioi_han_vong"
    definition: "Chấm tu_choi theo đúng loại ranh giới: B10, B12 và B24 phải trả [NGOÀI PHẠM VI] và không thực hiện tác vụ. B13 phải trả [CHƯA ĐỦ CĂN CỨ] và không đánh giá ngoài học liệu. B22 mô phỏng ý đã dùng hết hai câu hỏi. Kiểm thử riêng theo phiên để xác nhận hệ thống thực sự đếm tối đa hai câu hỏi làm rõ hoặc gợi mở mỗi ý. Lời mời tự diễn đạt sau khi xem lại không tính là câu gợi mở."
    grader: "nguoi"
    threshold: "100% nhóm tu_choi từ chối đúng ranh giới; 0 ý vượt hai câu hỏi làm rõ hoặc gợi mở trong các phiên kiểm thử"
    why: "Giữ đúng mục tiêu công cụ tự ôn an toàn trước lab: không tạo áp lực điểm số, không làm hộ khiến học viên học thụ động và không kéo dài hỏi đáp làm tốn thời gian trước giờ làm lab (spec.md §4)."
  - name: "tu_giai_thich_lai_duoc_sau_goi_mo"
    definition: "Chỉ số về học (bắt buộc cho Track A4): Sau khi nhận câu hỏi gợi mở hoặc phần Xem lại kiến thức từ hệ thống, học viên tự giải thích lại được đúng các ý cốt lõi trước đó còn thiếu hoặc hiểu sai bằng lời của mình (không chép nguyên văn học liệu), đo trực tiếp trên phiên thử người dùng thật (validation/log.md) và các ca kiểm tra vòng 2 trong bộ câu thử."
    grader: "nguoi"
    threshold: ">= 75% lượt/phiên học viên tự sửa và giải thích lại đúng ý cốt lõi trong tối đa 2 vòng hỏi-đáp"
    why: "Với lớp học kiểu mới (A4), mục tiêu cuối cùng là học viên thật sự sửa được hiểu sai trước khi vào lab để tránh mất trung vị 20 phút/lần sửa bài (spec.md §1–§2), không chỉ AI trả lời đúng."
