# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
                    # track A: khoá học · track B–F: người dùng của sản phẩm / nhóm nhắm tới, nguồn công khai có link
  low: 250
  base: 436
  high: 721
  source: "evidence/data-mining.md. Thấp: 250 người/tháng (tự ước tính). Cơ sở: lấy 436 học viên hoạt động trong 21 ngày làm mốc giả định. Cao: giả định toàn bộ 721 tài khoản trong tập dữ liệu đều dùng công cụ."

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: dung_it
    share: 0.422            # 184/436 học viên hoạt động
    uses_per_month: 2
    turns_per_session: 3
    source: "evidence/data-mining.md: tỷ trọng từ nhóm dùng ít. Tự ước tính 2 phiên/tháng, mỗi phiên 3 lượt giải thích đầu cho bài mẫu có 3 ý."
  - name: dung_vua
    share: 0.397            # 173/436 học viên hoạt động
    uses_per_month: 5
    turns_per_session: 6
    source: "evidence/data-mining.md: tỷ trọng từ nhóm dùng vừa. Tự ước tính 5 phiên/tháng, mỗi phiên 3 lượt đầu và 3 lượt giải thích lại hoặc xem lại."
  - name: dung_nhieu
    share: 0.181            # 79/436 học viên hoạt động
    uses_per_month: 10
    turns_per_session: 10
    source: "evidence/data-mining.md: tỷ trọng từ nhóm dùng nhiều. Tự ước tính 10 phiên/tháng, mỗi phiên 3 lượt đầu và 7 lượt giải thích lại, xem lại hoặc tự nhắc."
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token — chép từ further-reading/model-prices.md của repo đề. ≥2 mức model
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "https://aistudio.google.com/docs/pricing#gemini-3.1-flash-lite — giá Standard trả phí, xem 27/11/2026"
  - model: gemini-4-hydrogen
    input: 1.50
    output: 7.50
    source: "https://aistudio.google.com/docs/pricing#gemini-4-hydrogen — giá Standard trả phí, xem 27/11/2026"

